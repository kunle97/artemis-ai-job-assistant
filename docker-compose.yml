services:
  postgres:
    image: postgres:16
    container_name: artemis_postgres
    restart: always
    environment:
      POSTGRES_USER: artemis
      POSTGRES_PASSWORD: artemis
      POSTGRES_DB: artemis
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: artemis_redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  postgres_data: